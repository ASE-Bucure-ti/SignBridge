# =============================================================================
# SignBridge Test App — Build & Deploy to signbridge.ase.ro
# Triggers on push to main (app/ changes only) or manual dispatch
# Self-hosted runner runs directly on the deploy server
# =============================================================================

name: Deploy Test App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to deploy path
        run: |
          mkdir -p ${{ secrets.DEPLOY_PATH }}
          rsync -a --delete --exclude='node_modules' --exclude='dist' --exclude='.git' \
            app/ ${{ secrets.DEPLOY_PATH }}/app/
          cp docker-compose.yml ${{ secrets.DEPLOY_PATH }}/

      - name: Build and restart
        run: |
          cd ${{ secrets.DEPLOY_PATH }}
          docker compose build --no-cache signbridge-app
          docker compose up -d signbridge-app
          docker image prune -f
          echo "✅ Deployed at $(date -u)"
